<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brainbox-Zentrale</title>
<link rel="icon" href="/zentrale/logo.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Geist"; src: url("/zentrale/fonts/Geist.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/zentrale/fonts/GeistMono.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
/* Homelab-Konsole: dunkel als Standard (wie das Wiki), Brainbox-Grün als Akzent; Kacheln mit Statuspunkten */
:root {
  --bg: #0D1210; --rail: #080C0A; --panel: #131A16; --panel2: #1A231E; --line: #24302A; --fg: #E2EBE5; --muted: #8FA89A; --faint: #5E7468;
  --accent: #4CD596; --accent-strong: #118656; --accent-ink: #06110C; --ok: #4CD596; --warn: #E0A643; --bad: #F07A6E; --code: #0A0F0C;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root[data-theme="system"] {
  --bg: #F4F7F5; --rail: #E9EFEB; --panel: #FFFFFF; --panel2: #F1F5F2; --line: #D5E1DA; --fg: #112019; --muted: #52665B; --faint: #7D9086;
  --accent: #118656; --accent-strong: #0E6E47; --accent-ink: #FFFFFF; --ok: #118656; --warn: #A86A08; --bad: #C2402F; --code: #EEF3F0; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #F4F7F5; --rail: #E9EFEB; --panel: #FFFFFF; --panel2: #F1F5F2; --line: #D5E1DA; --fg: #112019; --muted: #52665B; --faint: #7D9086;
  --accent: #118656; --accent-strong: #0E6E47; --accent-ink: #FFFFFF; --ok: #118656; --warn: #A86A08; --bad: #C2402F; --code: #EEF3F0; color-scheme: light }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: 0.88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; background: linear-gradient(to right, var(--rail) 249px, var(--line) 249px 250px, transparent 250px); }
.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: var(--rail-h, 100vh); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand img { width: 30px; height: 30px; }
.brand b { display: block; font-size: 15px; }
.brand small { color: var(--muted); font: 12px var(--mono); }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); }
.nav button:hover { background: var(--panel); color: var(--fg); }
.nav button[aria-current="page"] { background: var(--panel2); color: var(--fg); font-weight: 500; }
.nav .dot { margin-left: auto; }
.rail .foot { margin-top: auto; display: grid; gap: 8px; }
.back { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--fg); background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; border-radius: 8px; font-size: 14px; }

main { min-width: 0; padding: 28px 32px 80px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
.kicker { font: 500 12px var(--mono); color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
h1 { font-size: 1.9rem; line-height: 1.15; margin: 4px 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.15rem; margin: 0 0 10px; }
.lede { color: var(--muted); margin: 0; max-width: 68ch; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; text-align: left; cursor: pointer; }
.tile:hover { border-color: var(--faint); }
.tile .k { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.tile .v { font-size: 1.45rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 12px; }
.card.soft { background: transparent; border-style: dashed; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.row .grow { flex: 1 1 220px; min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--faint); }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.pill { font: 12px var(--mono); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }

.btn { border: 1px solid var(--line); background: var(--panel2); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn.small { padding: 5px 10px; font-size: 13px; }

.steps { counter-reset: s; display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.steps > li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.steps > li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; font: 600 12px var(--mono); color: var(--accent); }
.steps p { margin: 2px 0 6px; }

.cmd { position: relative; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 70px 10px 12px; font: 13px/1.6 var(--mono); overflow-x: auto; white-space: pre; }
.cmd button { position: absolute; top: 6px; right: 6px; }

form.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
form.grid .full { grid-column: 1 / -1; }
label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=url], input[type=email], input[type=password], select, textarea { width: 100%; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; color: var(--fg); }
input:focus, select:focus { border-color: var(--accent); outline: none; }
.check { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.out { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; max-height: 320px; overflow: auto; margin: 0; }
.out.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.out.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }

.list { display: grid; gap: 10px; }
.server { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.server b { font-size: 1.02rem; }
.server .meta { color: var(--muted); font: 12.5px var(--mono); overflow-wrap: anywhere; }
.server .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.server form.rename { grid-column: 1 / -1; flex-wrap: wrap; }
.server form.rename[hidden] { display: none; }
.server .tag { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
.hint.warn { color: var(--warn); }

.prov { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.prov:last-child { border-bottom: 0; }
.prov b { display: flex; align-items: center; gap: 8px; }
.prov small { color: var(--muted); display: block; }
details.form > summary { list-style: none; cursor: pointer; }
details.form > summary::-webkit-details-marker { display: none; }
details.form[open] { background: var(--panel2); border-radius: 10px; padding: 12px; margin-top: 6px; }

.secret { display: flex; gap: 8px; align-items: center; background: var(--code); border: 1px dashed var(--warn); border-radius: 8px; padding: 8px 10px; font: 13px var(--mono); overflow-wrap: anywhere; }
.upd { display: inline-flex; align-items: center; gap: 4px; font: 600 11.5px var(--mono); color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 2px 8px 2px 6px; white-space: nowrap; }
.upd svg { width: 13px; height: 13px; }
.nav .upd { margin-left: auto; }
.banner { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--panel)), var(--panel) 60%); }
.banner .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none; }
.banner .ico svg { width: 20px; height: 20px; }
/* Einstellungen: Zeilen mit Schalter oder Auswahl */
.setrow { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.card > h2 + .setrow { border-top: 0; }
.setrow b { display: block; font-weight: 500; }
.setrow small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.setrow .ctl { flex: none; }
.setrow select, .member select { width: auto; min-width: 150px; }
.switch { position: relative; width: 38px; height: 22px; border-radius: 999px; border: 0; background: var(--line); cursor: pointer; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch[aria-checked="true"] { background: var(--accent-strong); }
.switch[aria-checked="true"]::after { left: 19px; }
.switch[disabled] { opacity: .5; cursor: progress; }
.ava { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: 600; font-size: 14px; flex: none; object-fit: cover; }
.ava.big { width: 52px; height: 52px; border-radius: 14px; font-size: 22px; }
.filebtn { display: inline-flex; align-items: center; }
.members { display: grid; }
.member { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.member:first-child { border-top: 0; }
.member b { font-weight: 500; }
.member .meta { color: var(--muted); font: 12.5px var(--mono); overflow-wrap: anywhere; }
.member .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tmpl:hover { border-color: var(--faint); }
.dot.bad { background: var(--bad); }
.setrow > .grow { flex: 1 1 auto; min-width: 0; }
/* Erst auf Handy-Breite umbrechen – eingebettet ist die Seite schmaler als das Fenster */
@media (max-width: 560px) {
  .setrow { flex-wrap: wrap; }
  .member { grid-template-columns: auto minmax(0, 1fr); }
  .member .status, .member .acts { grid-column: 2; justify-content: flex-start; }
  form.grid { grid-template-columns: minmax(0, 1fr); }
  .server { grid-template-columns: auto minmax(0, 1fr); }
  .server .acts { grid-column: 1 / -1; justify-content: flex-start; }
}
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
.topbar { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
/* Eingebettet in die Einstellungen des Wikis: ohne eigene Seitenleiste und Überschrift */
html.embed, html.embed body { height: auto; background: transparent; }
.shell.embed { display: block; background: none; min-height: 0; }
.shell.embed .rail { display: none; }
.shell.embed main { padding: 2px 0 28px; }
.shell.embed .wrap { max-width: none; margin: 0; }
.shell.embed .phead .kicker, .shell.embed .phead h1 { display: none; }
.gate { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
.gate .box { max-width: 420px; display: grid; gap: 12px; justify-items: center; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); background: none; }
  .rail { position: static; height: auto; padding: 12px; gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
  .nav button { padding: 7px 10px; white-space: nowrap; }
  .rail { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .rail .nav { grid-column: 1 / -1; grid-row: 2; }
  .rail .foot { display: block; margin: 0; grid-column: 2; grid-row: 1; }
  .rail .foot .hint { display: none; }
  .back { padding: 6px 10px; font-size: 13px; }
  main { padding: 18px 16px 70px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.55rem; }
}
</style>
<script>
// Die Zentrale wohnt in den Einstellungen des Wikis (Einstellungen → Brainbox) und wird
// dort mit ?embed=1 eingebettet. Wer /zentrale direkt aufruft, landet auf der passenden Seite.
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get("embed") === "1") {
    document.documentElement.classList.add("embed");
    if (q.get("theme") === "light") document.documentElement.dataset.theme = "light";
    return;
  }
  var map = { uebersicht: "brainbox", proxmox: "brainbox-proxmox", netbird: "brainbox-netbird", claude: "brainbox-claude", anmeldung: "brainbox-anmeldung", update: "brainbox-update",
    allgemein: "details", mitglieder: "users", sicherheit: "security", vorlagen: "templates", export: "export", profil: "", darstellung: "preferences", benachrichtigungen: "notifications" };
  window.BRAINBOX_REDIRECT = true;
  var target = map[location.hash.slice(1)];
  location.replace("/settings/" + (target === undefined ? "brainbox" : target));
})();
</script>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<script>
(function () {
  "use strict";
  // In der Demo läuft die Zentrale in einem Shadow-Root ohne eigene Adresszeile
  if (window.BRAINBOX_REDIRECT) return;
  const ROOT = window.BRAINBOX_ROOT || document;
  const USE_HASH = !window.BRAINBOX_ROOT;
  // Eingebettet: im Wiki (iframe) oder in der Demo. Seitenwechsel und Links übernimmt dann das Wiki.
  const EMBED = !!window.BRAINBOX_EMBED || document.documentElement.classList.contains("embed");
  const NAV_OUT = window.BRAINBOX_NAVIGATE || (EMBED && window.parent !== window ? (msg) => window.parent.postMessage(msg, location.origin) : null);
  const LOGO = window.BRAINBOX_LOGO || "/zentrale/logo.svg";
  const $ = (s, r = ROOT) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let S = null; // Status
  let view = USE_HASH ? (location.hash || "#uebersicht").slice(1) : "uebersicht";

  // --- Verbindung zum Brainbox-Dienst (in der Demo: nachgestellt) ---
  async function api(name, body) {
    if (window.BRAINBOX_MOCK) return window.BRAINBOX_MOCK(name, body);
    const opt = body === undefined ? { headers: { Accept: "application/json" } } :
      { method: "POST", headers: { "Content-Type": "application/json", "X-Brainbox": "1" }, body: JSON.stringify(body) };
    const r = await fetch(`/zentrale/api/${name}`, { credentials: "same-origin", ...opt });
    if (r.status === 401) throw Object.assign(new Error("login"), { gate: "login" });
    if (r.status === 403) {
      // „Nur für Admins“ nur, wenn es wirklich an der Rolle liegt – sonst die echte Meldung zeigen
      const j = await r.json().catch(() => ({}));
      if (j.error === "admin") throw Object.assign(new Error("admin"), { gate: "admin" });
      throw new Error(j.message || "Abgelehnt.");
    }
    return r.json();
  }
  let tt;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2800); }
  function copy(text, btn) {
    const done = () => { if (btn) { const o = btn.textContent; btn.textContent = "Kopiert"; setTimeout(() => (btn.textContent = o), 1500); } };
    try { navigator.clipboard.writeText(text).then(done, () => toast("Bitte markieren und kopieren")); } catch (e) { toast("Bitte markieren und kopieren"); }
  }
  const ago = (iso) => { if (!iso) return "noch nie"; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "gerade eben" : m < 60 ? `vor ${m} Min.` : m < 1440 ? `vor ${Math.round(m / 60)} Std.` : new Date(iso).toLocaleString("de-DE"); };
  const ICON_UPDATE = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1ZM5 16a1 1 0 0 1 1 1v2h12v-2a1 1 0 1 1 2 0v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z"/></svg>';
  const hasUpdate = () => !!(S && S.update && S.update.available);
  const cmd = (text) => `<div class="cmd">${esc(text)}<button type="button" class="btn small" data-copy="${esc(text)}">Kopieren</button></div>`;

  const NAV = [
    ["uebersicht", "Übersicht"], ["proxmox", "Proxmox-Server"], ["netbird", "NetBird"], ["claude", "Künstliche Intelligenz"],
    ["bereiche", "Bereiche"], ["anmeldung", "Anmeldung"], ["update", "Version & Update"],
  ];
  const navDot = (k) => {
    if (!S) return "";
    if (k === "update") return hasUpdate() ? `<span class="upd" title="Update verfügbar">${ICON_UPDATE}${esc(S.update.latest)}</span>` : "";
    const st = { proxmox: S.proxmox.length ? "ok" : "", netbird: S.netbird ? "ok" : "", claude: tp("mcp", true) ? "ok" : "", bereiche: S.sync.counts.areas ? "ok" : "" }[k];
    return st === undefined ? "" : `<span class="dot ${st}"></span>`;
  };

  function shell(content) {
    $("#app").innerHTML = `<div class="shell${EMBED ? " embed" : ""}">
      <nav class="rail" aria-label="Zentrale">
        <div class="brand"><img src="${LOGO}" alt=""><div><b>Brainbox-Zentrale</b><small>${esc(S ? `v${S.version.brainbox}` : "")}${hasUpdate() ? " · Update da" : ""}</small></div></div>
        <div class="nav">${NAV.map(([k, l]) => `<button type="button" data-go="${k}" ${view === k ? 'aria-current="page"' : ""}>${esc(l)}${navDot(k)}</button>`).join("")}</div>
        <div class="foot"><a class="back" href="/" data-wiki>← Zum Wiki</a><span class="hint">Angemeldet als ${esc(S?.user?.name || "")}</span></div>
      </nav>
      <main><div class="wrap" id="page">${content}</div></main>
    </div>`;
  }
  function go(k) {
    if (NAV_OUT && k !== view) {
      if (k === "bereiche") { NAV_OUT({ type: "brainbox:open", href: S.sync.areasUrl || S.sync.rulesUrl || "/home" }); return; }
      NAV_OUT({ type: "brainbox:go", page: k });
      return;
    }
    view = k;
    if (USE_HASH) { try { history.replaceState(null, "", `#${k}`); } catch (e) { /* egal */ } }
    render();
    const m = $("main"); if (m && m.scrollTo) m.scrollTo(0, 0); window.scrollTo(0, 0);
  }
  window.BRAINBOX_GO = (k) => { view = k; render(); };

  // --- Seiten ---
  function pUebersicht() {
    const c = S.sync.counts;
    const ways = 1 + ["email", "google", "microsoft", "discord", "oidc"].filter((k) => S.login[k]).length + (S.login.passkeys ? 1 : 0);
    const tile = (k, dot, label, value, sub) => `<button type="button" class="tile" data-go="${k}"><span class="k"><span class="dot ${dot}"></span>${esc(label)}</span><span class="v">${esc(value)}</span><span class="s">${esc(sub)}</span></button>`;
    return `<div class="phead"><div class="kicker">${esc(S.wiki.name)} · ${esc(S.wiki.url.replace(/^https?:\/\//, ""))}</div><h1>Übersicht</h1>
      <p class="lede">Hier steuerst du alles rund um dein Wiki: welche Proxmox-Server und welches NetBird drin stehen, ob Claude mitschreiben darf, wie man sich anmeldet und welche Version läuft.</p></div>
      ${hasUpdate() ? updateBanner() : ""}
      <div class="tiles">
        ${tile("proxmox", S.proxmox.length ? "ok" : "", "Proxmox-Server", String(S.proxmox.length), S.proxmox.length ? `${c.guests} VMs und Container im Wiki` : "noch keiner verbunden")}
        ${tile("netbird", S.netbird ? "ok" : "", "NetBird", S.netbird ? "verbunden" : "aus", S.netbird ? `${c.peers} Geräte im Wiki` : "Geräte und Domains ins Wiki holen")}
        ${tile("claude", tp("mcp", true) ? "ok" : "", "Künstliche Intelligenz", tp("mcp", true) ? "an" : "aus", tp("mcp", true) ? "Claude mit deiner Anmeldung" : "Claude zulassen")}
        ${tile("bereiche", c.areas ? "ok" : "", "Bereiche", String(S.sync.areas.filter((x) => !x.includes("/")).length), c.areas ? (c.areas > S.sync.areas.filter((x) => !x.includes("/")).length ? `mit ${c.areas - S.sync.areas.filter((x) => !x.includes("/")).length} Unterbereichen` : "per Zuordnungsregeln sortiert") : "z. B. Minecraft-Server")}
        ${tile("anmeldung", "ok", "Anmeldung", String(ways), ways === 1 ? "Weg zum Einloggen aktiv" : "Wege zum Einloggen aktiv")}
        ${tile("update", hasUpdate() ? "warn" : "ok", "Version", `v${S.version.brainbox}`, hasUpdate() ? `Update auf v${S.update.latest} verfügbar` : `Kern ${S.version.core.replace(/^v/, "")}`)}
      </div>
      <div class="card"><div class="row"><span class="dot ${S.sync.timer ? "ok" : "warn"}"></span><div class="grow"><b>Abgleich</b><div class="hint">Zuletzt ${esc(ago(S.sync.lastRun))} · ${S.sync.timer ? "läuft automatisch alle 5 Minuten" : "Zeitplan aus – startet, sobald Proxmox oder NetBird verbunden ist"}</div></div>
        <button type="button" class="btn" data-act="sync">Jetzt abgleichen</button></div><pre class="out" id="out-sync" hidden></pre></div>
      <div class="card"><h2>Login-Link</h2><p class="hint">Ein Link, der einmal anmeldet und 60 Minuten gilt – für dich auf einem neuen Gerät oder für jemanden, den du eingeladen hast.</p>
        <form class="row" data-form="link"><input class="grow" type="email" name="email" placeholder="E-Mail (leer = du als Admin)" aria-label="E-Mail für den Login-Link"><button class="btn primary" type="submit">Link erstellen</button></form><pre class="out" id="out-link" hidden></pre></div>`;
  }

  const AGENT_FRESH_MIN = 15;
  const agentFresh = (iso) => !!iso && (Date.now() - new Date(iso)) / 60000 <= AGENT_FRESH_MIN;
  function agentResult(d) {
    return `<div class="card" style="margin-top:12px"><h2>Befehl für „${esc(d.name)}“</h2>
      <ol class="steps">
        <li><div><b>Auf dem Proxmox-Host am anderen Standort ausführen</b><p class="hint">Im Proxmox-Webinterface dort: <b>Datacenter → Node → Shell</b>, Befehl einfügen, Enter.</p>${cmd(d.command)}
          <p class="hint">Der Befehl enthält einen Schlüssel nur für diesen Server. Er wird nur jetzt angezeigt. Ein neuer Befehl macht den alten ungültig.</p></div></li>
        <li><div><b>Fertig</b><p class="hint">Der Server meldet sich sofort und dann alle 5 Minuten. Nach etwa einer Minute steht er hier und im Wiki.</p></div></li>
      </ol>${d.public ? "" : `<p class="hint warn">Achtung: Deine Wiki-Adresse <code>${esc(d.url)}</code> ist nur im Heimnetz erreichbar. Der andere Standort braucht eine Adresse, die er erreicht – trag unter <a href="#anmeldung" data-go="anmeldung">Anmeldung</a> die öffentliche Adresse ein.</p>`}</div>`;
  }
  function pProxmox() {
    const list = S.proxmox.length ? S.proxmox.map((x) => {
      const agent = x.mode === "agent";
      const live = agent ? agentFresh(x.lastSeen) : x.online !== false;
      const meta = agent
        ? `meldet sich selbst · ${x.lastSeen ? `zuletzt ${esc(ago(x.lastSeen))}` : "wartet auf die erste Meldung"}`
        : `${esc(x.url)} · ${esc(x.tokenId)}${x.insecure ? " · Zertifikat ungeprüft" : ""}${x.online === false ? " · gerade nicht erreichbar" : ""}`;
      return `<div class="server">
        <span class="dot ${live ? "ok" : "warn"}"></span>
        <div><b>${esc(x.name)}</b>${agent ? ' <span class="tag">anderer Standort</span>' : ""}<div class="meta">${meta}${x.guests != null ? ` · ${x.guests} VMs/Container` : ""}</div></div>
        <div class="acts">${x.wikiUrl ? `<a class="btn small" href="${esc(x.wikiUrl)}" style="text-decoration:none">Im Wiki</a>` : ""}<button type="button" class="btn small" data-act="proxmox/test" data-name="${esc(x.name)}">Prüfen</button><button type="button" class="btn small" data-rename="${esc(x.name)}">Umbenennen</button>${agent ? `<button type="button" class="btn small" data-act="proxmox/agent" data-name="${esc(x.name)}">Neuer Befehl</button>` : ""}<button type="button" class="btn small danger" data-act="proxmox/remove" data-name="${esc(x.name)}">Entfernen</button></div>
        <form class="row rename" data-form="proxmox-rename" data-name="${esc(x.name)}" hidden>
          <input class="grow" type="text" name="newName" value="${esc(x.name)}" required pattern="[a-z0-9][a-z0-9.\\-]{0,62}" title="Kleinbuchstaben, Ziffern, Punkt und Bindestrich, z. B. zuhause oder ph.morn.lan" aria-label="Neuer Name für ${esc(x.name)}" autocomplete="off">
          <button class="btn small primary" type="submit">Speichern</button><button class="btn small" type="button" data-rename-cancel>Abbrechen</button>
          <span class="hint">Die Wiki-Seiten bekommen den neuen Namen, Notizen bleiben.</span>
        </form>
      </div>`;
    }).join("") : `<div class="empty">Noch kein Proxmox-Server verbunden. Leg unten den ersten an.</div>`;
    return `<div class="phead"><div class="kicker">Verbindungen</div><h1>Proxmox-Server</h1>
      <p class="lede">Verbinde beliebig viele Proxmox-Server oder Cluster – im selben Netz oder an anderen Standorten. Jeder bekommt im Wiki eine eigene Seite mit Nodes und Auslastung, darunter je VM und Container ein Eintrag. Neue VMs erscheinen nach spätestens 5 Minuten, gelöschte werden archiviert. Brainbox liest Proxmox nur, ändert dort nichts.</p></div>
      <div class="list">${list}</div><pre class="out" id="out-proxmox" hidden></pre>
      <div class="card"><h2>Server im selben Netz</h2>
        <p class="hint" style="margin-top:-4px">Brainbox kommt direkt an den Server heran – zu Hause, im Keller oder über ein VPN.</p>
        <ol class="steps">
          <li><div><b>Lesezugang auf dem neuen Server anlegen</b><p class="hint">In der Shell des Proxmox-Hosts (Datacenter → Node → Shell) einmal ausführen. Der Nutzer darf nur lesen (Rolle PVEAuditor).</p>
            ${cmd("pveum user add brainbox@pve\npveum acl modify / --users brainbox@pve --roles PVEAuditor\npveum user token add brainbox@pve wiki --privsep 0")}
            <p class="hint">Die letzte Zeile zeigt <code>full-tokenid</code> und <code>value</code>. Beides brauchst du gleich, <code>value</code> wird nur dieses eine Mal angezeigt.</p></div></li>
          <li><div><b>Daten eintragen</b>
            <form class="grid" data-form="proxmox">
              <label>Name <input type="text" name="name" required placeholder="zuhause" pattern="[a-z0-9][a-z0-9.\\-]{0,62}" title="Kleinbuchstaben, Ziffern, Punkt und Bindestrich, z. B. zuhause oder ph.morn.lan" autocomplete="off"></label>
              <label>Adresse <input type="text" name="url" required placeholder="https://192.168.1.2:8006" autocomplete="off"></label>
              <label>Token-ID (full-tokenid) <input type="text" name="tokenId" required value="brainbox@pve!wiki" autocomplete="off"></label>
              <label>Secret (value) <input type="password" name="secret" required autocomplete="new-password"></label>
              <label class="check full"><input type="checkbox" name="insecure" checked> Zertifikat nicht prüfen (Proxmox nutzt meist ein selbst ausgestelltes – im Heimnetz üblich)</label>
              <div class="full row"><button class="btn primary" type="submit">Verbinden und prüfen</button><span class="hint">Brainbox testet den Zugang, bevor es speichert.</span></div>
            </form></div></li>
        </ol></div>
      <div class="card"><h2>Server an einem anderen Standort</h2>
        <p class="hint" style="margin-top:-4px">Brainbox kommt nicht an den Server heran – er steht woanders, hinter einer anderen Firewall. Dann meldet er sich selbst: Ein kleiner Brainbox-Agent liest dort alle 5 Minuten VMs und Container (nur lesend) und schickt sie an <code>${esc(S.wiki.url || "deine Brainbox")}</code>. Offene Ports oder ein VPN braucht es dafür nicht.</p>
        <form class="row" data-form="proxmox-agent"><input class="grow" type="text" name="name" required placeholder="Name, z. B. standort-2" pattern="[a-z0-9][a-z0-9.\\-]{0,62}" title="Kleinbuchstaben, Ziffern, Punkt und Bindestrich, z. B. zuhause oder ph.morn.lan" aria-label="Name des Servers" autocomplete="off"><button class="btn primary" type="submit">Befehl erzeugen</button></form>
        <div id="agent-result"></div></div>
      <p class="hint">Mit Tags und <a href="#bereiche" data-go="bereiche">Zuordnungsregeln</a> landen die VMs auch in deinen Bereichen. Im Terminal geht dasselbe mit <code>brainbox-connect proxmox add …</code>, <code>proxmox agent NAME</code> und <code>proxmox rename ALT NEU</code>.</p>`;
  }

  function pNetbird() {
    return `<div class="phead"><div class="kicker">Verbindungen</div><h1>NetBird</h1>
      <p class="lede">Holt alle NetBird-Geräte, Netzwerke und Domains ins Wiki – auch die Domains vom NetBird-Reverse-Proxy samt Ziel, Status und Schutz – und verknüpft sie mit den passenden VMs: über das Ziel des Dienstes, gleichen Namen oder gleiche IP.</p></div>
      ${S.netbird ? `<div class="server"><span class="dot ok"></span><div><b>Verbunden</b><div class="meta">${esc(S.netbird.url)} · ${S.sync.counts.peers} Geräte im Wiki</div></div>
        <div class="acts">${S.netbird.wikiUrl ? `<a class="btn small" href="${esc(S.netbird.wikiUrl)}" style="text-decoration:none">Im Wiki</a>` : ""}<button type="button" class="btn small danger" data-act="netbird/remove">Trennen</button></div></div>` : ""}
      <pre class="out" id="out-netbird" hidden></pre>
      <div class="card"><h2>${S.netbird ? "Zugang ändern" : "NetBird verbinden"}</h2>
        <ol class="steps">
          <li><div><b>Access Token anlegen</b><p class="hint">Im NetBird-Dashboard unter <b>Team → Service Users</b> einen Nutzer mit Rolle <b>„Admin“</b> anlegen und dort ein Token erstellen. „User“ reicht für Geräte und Netzwerke, aber nicht für die Domains vom Reverse-Proxy. Brainbox ändert in NetBird nichts. Alternativ: eigenes Profil → Personal Access Tokens.</p></div></li>
          <li><div><b>Eintragen</b>
            <form class="grid" data-form="netbird">
              <label>API-Adresse <input type="text" name="url" required value="${esc(S.netbird?.url || "https://api.netbird.io")}"></label>
              <label>Access Token <input type="password" name="token" required autocomplete="new-password"></label>
              <p class="hint full">NetBird Cloud: <code>https://api.netbird.io</code>. Selbst gehostet: die Adresse deines Management-Servers.</p>
              <div class="full"><button class="btn primary" type="submit">Verbinden und prüfen</button></div>
            </form></div></li>
        </ol></div>`;
  }

  function pClaude() {
    const t = ME.team;
    const on = tp("mcp", true);
    const mcpUrl = `${(S.wiki.url || location.origin).replace(/\/$/, "")}/mcp`;
    const https = /^https:/.test(mcpUrl);
    return `${head("Verbindungen", "Künstliche Intelligenz", "Claude arbeitet direkt in deiner Brainbox – mit deiner Anmeldung und deinen Rechten, ohne eigenes Konto. Claude sucht, liest und schreibt Seiten und bedient Brainbox: Proxmox-Server hinzufügen, umbenennen und prüfen, NetBird verbinden, abgleichen, Updates einspielen.")}
      <div class="card"><h2>MCP-Anschluss</h2>
        ${setrow("Claude und andere KI-Assistenten zulassen", "Über diesen Anschluss verbindet sich Claude. Ausgeschaltet kommt keine KI mehr ins Wiki – bestehende Verbindungen eingeschlossen.", toggle("data-team-pref", "mcp", on))}
        ${on ? `<p class="hint">Adresse für den Connector:</p>${cmd(mcpUrl)}${https ? "" : '<p class="hint warn">Die Claude-App braucht eine HTTPS-Adresse aus dem Internet. Trag sie unter <a href="#anmeldung" data-go="anmeldung">Anmeldung</a> ein.</p>'}` : ""}
      </div>
      ${on ? `<div class="card"><h2>Claude verbinden</h2>
        <ol class="steps">
          <li><div><b>Claude-App</b> (claude.ai, Desktop, Handy)<p class="hint">In Claude: <b>Einstellungen → Connectors → Benutzerdefinierten Connector hinzufügen</b>. Name „Brainbox“, URL wie oben. Dann „Verbinden“, im Brainbox-Fenster mit deinem Konto anmelden und „Zulassen“.</p></div></li>
          <li><div><b>Claude Code</b><p class="hint">Im Terminal einmal ausführen, dann in Claude Code <code>/mcp</code> → Brainbox → anmelden.</p>${cmd(`claude mcp add --transport http brainbox ${mcpUrl}`)}</div></li>
          <li><div><b>Loslegen</b><p class="hint">Einfach sagen, was du willst, z. B.:</p>
            <ul class="hint" style="margin:0;padding-left:18px">
              <li>„Füg meinen Proxmox in Frankfurt hinzu, an den kommt Brainbox nicht direkt ran.“</li>
              <li>„Benenn den Server proxmox-2 in zuhause um.“</li>
              <li>„Welche VMs laufen gerade, und welche Domains zeigen auf mc-proxy?“</li>
              <li>„Schreib eine Anleitung, wie ich den Minecraft-Server neu starte, und häng sie an die VM.“</li>
              <li>„Gibt es ein Update? Dann spiel es ein.“</li>
            </ul></div></li>
        </ol></div>
      <div class="card"><h2>Was Claude darf</h2>
        ${setrow("Im Wiki", "Suchen, lesen, schreiben, kommentieren, verschieben und Vorlagen nutzen – genau wie du. Was Claude schreibt, steht mit deinem Namen da.", '<span class="pill ok">wie du</span>')}
        ${setrow("Brainbox bedienen", "Status, Proxmox-Server (im selben Netz oder an anderen Standorten), umbenennen, prüfen, entfernen, NetBird, Abgleich und Update. Nur für Admins – Claude fragt vor dem Entfernen und vor einem Update nach.", `<span class="pill ${ME.user.role === "admin" ? "ok" : ""}">${ME.user.role === "admin" ? "du bist Admin" : "nur Admins"}</span>`)}
        ${setrow("Wissen über Brainbox", "Claude bekommt beim Verbinden eine Beschreibung: wie das Wiki aufgebaut ist, was der Abgleich überschreibt (alles über „Notizen“) und wie man Proxmox-Server hinzufügt.", '<span class="pill ok">eingebaut</span>')}
      </div>
      <div class="card"><h2>Eigene Anweisungen</h2>
        <p class="hint" style="margin-top:-4px">Kommt zu Brainbox' Beschreibung dazu – z. B. Ton, Vorlieben oder was Claude nie tun soll.</p>
        <form class="grid" data-form="ki-guidance">
          <label class="full">Anweisungen <textarea name="guidance" rows="6" style="font:inherit;line-height:1.5;resize:vertical" maxlength="4000" placeholder="Schreibe kurz und mit Stichpunkten. Frag nach, bevor du Seiten löschst.">${esc(t.guidanceMCP || "")}</textarea></label>
          <div class="full row"><button class="btn primary" type="submit">Speichern</button></div>
        </form></div>` : ""}
      ${S.claude.account ? `<div class="card"><h2>Altes Konto „Claude“</h2>
        <p class="hint" style="margin-top:-4px">Frühere Brainbox-Versionen haben Claude ein eigenes Konto gegeben (${esc(S.claude.email)}). Das braucht es nicht mehr. Sperr es unter Mitglieder, dann gilt auch sein alter Schlüssel nicht mehr. Seine Seiten bleiben.</p>
        <div class="row"><button type="button" class="btn" data-go="mitglieder">Zu den Mitgliedern</button></div></div>` : ""}`;
  }

  function pBereiche() {
    return `<div class="phead"><div class="kicker">Ordnung</div><h1>Bereiche</h1>
      <p class="lede">Sortiert Domains, VMs und NetBird-Geräte automatisch in Bereiche – zum Beispiel alles unter <code>*.morninghosting.de</code> nach „Minecraft-Server“. Die Regeln sind eine normale Wiki-Seite, die du direkt bearbeitest.</p></div>
      <div class="card"><h2>${S.sync.counts.areas} Bereiche</h2>
        <div class="row">${S.sync.areas.length ? S.sync.areas.map((a) => `<span class="pill ok">${esc(a.replace(/\//g, " › "))}</span>`).join("") : '<span class="hint">Noch keine – sobald Proxmox oder NetBird verbunden ist, legt Brainbox die Seite „Zuordnungsregeln“ an.</span>'}</div>
        <div class="row">${S.sync.rulesUrl ? `<a class="btn primary" href="${esc(S.sync.rulesUrl)}" style="text-decoration:none">Zuordnungsregeln öffnen</a>` : ""}<button type="button" class="btn" data-act="sync">Jetzt abgleichen</button></div>
        <pre class="out" id="out-sync" hidden></pre></div>
      <div class="card"><h2>So schreibst du Regeln</h2>
        <p class="hint">Eine Zeile pro Regel in der Tabelle auf der Seite „Zuordnungsregeln“. Die erste passende gewinnt – Genaues nach oben, Allgemeines nach unten.</p>
        <div class="cmd">| Muster                     | Bereich                   |
| survival.morninghosting.de | Minecraft-Server/Survival |
| *.morninghosting.de        | Minecraft-Server          |
| tag:minecraft              | Minecraft-Server          |
| gruppe:Server              | Homelab                   |</div>
        <ul class="hint" style="margin:0;padding-left:18px">
          <li><code>*.domain.de</code> – alle Domains darunter · <code>name:mc-*</code> – VM-/Gerätenamen · <code>tag:…</code> – Proxmox-Tags · <code>gruppe:…</code> – NetBird-Gruppen</li>
          <li><code>A/B</code> legt Unterbereiche an. Eine VM erbt den Bereich ihrer Domain, ein Gerät den seiner VM.</li>
        </ul></div>`;
  }

  function provRow(key, name, on, sub, fields) {
    return `<div class="prov"><div><b><span class="dot ${on ? "ok" : ""}"></span>${esc(name)}</b><small>${sub}</small></div><span class="pill ${on ? "ok" : ""}">${on ? "an" : "aus"}</span>
      ${fields ? `<details class="form" style="grid-column:1/-1"><summary class="hint">▸ ${on ? "Ändern oder ausschalten" : "Einrichten"}</summary>
        <form class="grid" data-form="login" style="margin-top:10px">${fields}<div class="full row"><button class="btn primary" type="submit">Speichern und neu starten</button>${on ? `<button class="btn danger" type="button" data-clear="${esc(key)}">Ausschalten</button>` : ""}</div></form></details>` : ""}</div>`;
  }
  function pAnmeldung() {
    const L = S.login, url = S.wiki.url;
    const f = (name, label, type = "text", ph = "") => `<label>${esc(label)} <input type="${type}" name="${name}" placeholder="${esc(ph)}" autocomplete="off"></label>`;
    return `<div class="phead"><div class="kicker">Zugang</div><h1>Anmeldung</h1>
      <p class="lede">Welche Wege zum Einloggen es gibt. ${S.wiki.inviteRequired ? "Rein kommt nur, wen du unter Einstellungen → Wiki → Mitglieder eingeladen hast – egal über welchen Weg." : "Achtung: Einladungen sind nicht erforderlich – mit Google oder Microsoft könnte sich jedes Konto anmelden."}</p></div>
      <div class="card">
        ${provRow("link", "Login-Link", true, "Immer da. Neuen Link unter Übersicht erstellen.")}
        ${provRow("email", "E-Mail", !!L.email, L.email ? `Login-Links per Mail über ${esc(L.email)}` : "Braucht ein Postfach zum Versenden, z. B. Gmail mit App-Passwort.",
          `<label>Postfach <select name="SMTP_PRESET"><option value="smtp.gmail.com:465">Gmail</option><option value="mail.gmx.net:587">GMX</option><option value="smtp.web.de:587">web.de</option><option value="smtp-mail.outlook.com:587">Outlook / Hotmail</option><option value="smtp.office365.com:587">Microsoft 365</option><option value="smtp.ionos.de:465">IONOS</option><option value="smtp.strato.de:465">Strato</option></select></label>
           ${f("SMTP_USERNAME", "E-Mail-Adresse", "email", "brainbox@gmail.com")}${f("SMTP_PASSWORD", "App-Passwort", "password")}${f("SMTP_FROM_EMAIL", "Absender (leer = gleiche Adresse)", "email")}`)}
        ${provRow("passkeys", "Passkeys", L.passkeys, L.passkeys ? "An. Jeder legt seinen unter Einstellungen → Konto → Passkeys an." : "Brauchen die HTTPS-Adresse mit Domain.")}
        ${provRow("google", "Google", L.google, `Redirect-URI: <code>${esc(url)}/auth/google.callback</code> · Schlüssel aus der Google Cloud Console`, f("GOOGLE_CLIENT_ID", "Client-ID") + f("GOOGLE_CLIENT_SECRET", "Clientschlüssel", "password"))}
        ${provRow("microsoft", "Microsoft", L.microsoft, `Firmen- und Schulkonten · Redirect-URI: <code>${esc(url)}/auth/azure.callback</code>`, f("AZURE_CLIENT_ID", "Anwendungs-ID") + f("AZURE_CLIENT_SECRET", "Geheimer Schlüssel", "password") + f("AZURE_TENANT_ID", "Tenant (leer = alle Organisationen)"))}
        ${provRow("discord", "Discord", L.discord, `Redirect-URI: <code>${esc(url)}/auth/discord.callback</code>`, f("DISCORD_CLIENT_ID", "Client ID") + f("DISCORD_CLIENT_SECRET", "Client Secret", "password") + f("DISCORD_SERVER_ID", "Server-ID (optional)"))}
        ${provRow("oidc", L.oidc || "Eigener Login-Dienst (OIDC)", !!L.oidc, `Pocket ID, Authentik, Keycloak … · Redirect-URI: <code>${esc(url)}/auth/oidc.callback</code>`, f("OIDC_DISPLAY_NAME", "Name auf dem Knopf", "text", "Pocket ID") + f("OIDC_ISSUER_URL", "Issuer-URL") + f("OIDC_CLIENT_ID", "Client-ID") + f("OIDC_CLIENT_SECRET", "Client-Secret", "password"))}
      </div><pre class="out" id="out-login" hidden></pre>
      <p class="hint">Nach dem Speichern startet das Wiki neu (etwa eine Minute). Im Terminal geht dasselbe mit <code>brainbox-login</code>.</p>`;
  }

  function pUpdate() {
    const u = S.update || {};
    return `<div class="phead"><div class="kicker">System</div><h1>Version & Update</h1>
      <p class="lede">Brainbox hat eigene Versionen. Zu jeder Version gehört ein fest getesteter Wiki-Kern.</p></div>
      ${hasUpdate() ? updateBanner(true) : ""}
      <div class="tiles"><div class="tile"><span class="k">Installiert</span><span class="v">v${esc(S.version.brainbox)}</span><span class="s">Kern ${esc(S.version.core.replace(/^v/, ""))}</span></div>
        <div class="tile"><span class="k"><span class="dot ${hasUpdate() ? "warn" : u.latest ? "ok" : ""}"></span>Neueste Version</span><span class="v">${u.latest ? `v${esc(hasUpdate() ? u.latest : S.version.brainbox)}` : "–"}</span><span class="s">${u.checkedAt ? `geprüft ${esc(ago(u.checkedAt))}` : "noch nicht geprüft"}${u.error ? ` · ${esc(u.error)}` : ""}</span></div>
        <div class="tile"><span class="k">Automatisch</span><span class="v">alle 6 Std.</span><span class="s">sieht Brainbox selbst nach neuen Versionen</span></div></div>
      <div class="card"><h2>Aktualisieren</h2><p class="hint">Vor dem Update sichert Brainbox Datenbank und Einstellungen. Geht beim Bauen etwas schief, läuft automatisch wieder die alte Version. Das Wiki ist währenddessen 10 bis 20 Minuten nicht erreichbar.</p>
        <div class="row"><button type="button" class="btn" data-act="update/check">Nach Updates suchen</button><button type="button" class="btn primary" data-act="update/start">Update starten</button><button type="button" class="btn" data-act="update/log">Protokoll anzeigen</button></div>
        <pre class="out" id="out-update" hidden></pre></div>

        <ol class="steps">
          <li><div><b>Im Container</b> (Proxmox → Container → Konsole)<p class="hint">Aktualisieren, nur nachsehen oder neu bauen:</p>${cmd("update")}<p class="hint" style="margin-top:6px"><code>update --check</code> nur nachsehen · <code>update --force</code> neu bauen · <code>brainbox-update</code> geht genauso</p></div></li>
          <li><div><b>Vom Proxmox-Host aus</b><p class="hint">Ohne in den Container zu wechseln – <code>${esc(S.ctid || "<CTID>")}</code> ist die Nummer des Containers:</p>${cmd(`pct exec ${S.ctid || "<CTID>"} -- update`)}</div></li>
        </ol></div>

  }
  function updateBanner(onUpdatePage) {
    const u = S.update;
    return `<div class="card banner"><div class="row"><span class="ico">${ICON_UPDATE}</span><div class="grow"><b>Update verfügbar: Brainbox ${esc(u.latest)}</b><div class="hint">Installiert ist ${esc(u.current)}${u.latestCore && u.latestCore !== u.currentCore ? ` · neuer Kern ${esc(u.latestCore.replace(/^v/, ""))}` : ""}. Vorher wird alles gesichert.</div></div>
      ${onUpdatePage ? `<button type="button" class="btn primary" data-act="update/start">Jetzt aktualisieren</button>` : `<button type="button" class="btn primary" data-go="update">Zum Update</button>`}</div></div>`;
  }

  // =====================================================================================================
  // Wiki- und Konto-Einstellungen im Stil der Zentrale (Allgemein, Mitglieder, Sicherheit, Vorlagen,
  // Export, Profil, Darstellung, Benachrichtigungen). Sie sprechen mit der Sitzung des Nutzers direkt
  // mit der Wiki-API (/api/…). Eingefügt in zentrale/app.html.
  // =====================================================================================================
  let ME = null; // auth.info: { user, team }
  const W = {}; // nachgeladene Listen: users, templates, exports, collections
  function csrf() { const m = document.cookie.match(/(?:^|;\s*)(?:__Host-)?csrfToken=([^;]+)/); return m ? decodeURIComponent(m[1]) : ""; }
  async function wiki(ep, body = {}) {
    if (window.BRAINBOX_MOCK) return window.BRAINBOX_MOCK(`wiki:${ep}`, body);
    const r = await fetch(`/api/${ep}`, { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", Accept: "application/json", "x-csrf-token": csrf() }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) throw Object.assign(new Error("login"), { gate: "login" });
    if (!r.ok) throw new Error(j.message || `Das hat nicht geklappt (Fehler ${r.status}).`);
    return j;
  }
  const isAdmin = () => ME?.user?.role === "admin";
  const tp = (k, d) => (ME?.team?.preferences && k in ME.team.preferences ? ME.team.preferences[k] : d);
  const up = (k, d) => (ME?.user?.preferences && k in ME.user.preferences ? ME.user.preferences[k] : d);
  const toggle = (attr, key, on, disabled) => `<button type="button" class="switch" role="switch" ${attr}="${esc(key)}" aria-checked="${on ? "true" : "false"}" aria-label="${esc(key)}"${disabled ? " disabled" : ""}></button>`;
  const setrow = (title, desc, control) => `<div class="setrow"><div class="grow"><b>${esc(title)}</b>${desc ? `<small>${desc}</small>` : ""}</div><div class="ctl">${control}</div></div>`;
  const choice = (attr, key, value, options) => `<select ${attr}="${esc(key)}" aria-label="${esc(key)}">${options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const head = (kicker, title, lede) => `<div class="phead"><div class="kicker">${esc(kicker)}</div><h1>${esc(title)}</h1><p class="lede">${lede}</p></div>`;
  const loading = '<div class="empty">Lädt …</div>';
  const initial = (name) => esc((name || "?").trim()[0] || "?").toUpperCase();
  const avatarBox = (url, name, color, cls = "") => url ? `<img class="ava ${cls}" src="${esc(url)}" alt="">` : `<span class="ava ${cls}" style="background:${esc(color || "#2F7A5B")}">${initial(name)}</span>`;
  const dateDe = (iso) => (iso ? new Date(iso).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" }) : "–");
  const BRAINBOX_ACCOUNTS = /^(automatik|claude)@/;
  // Daten einer Seite einmal nachladen, dann neu zeichnen
  async function need(key, loader) {
    if (W[key] !== undefined) return W[key];
    W[key] = null;
    try { W[key] = await loader(); } catch (e) { W[key] = { error: e.message }; }
    render();
    return W[key];
  }

  async function saveTeam(patch, msg = "Gespeichert") {
    const r = await wiki("team.update", patch);
    ME.team = { ...ME.team, ...(r.data || {}), preferences: { ...(ME.team.preferences || {}), ...((r.data || {}).preferences || patch.preferences || {}) } };
    toast(msg); render();
  }
  async function saveUser(patch, msg = "Gespeichert") {
    const r = await wiki("users.update", patch);
    ME.user = { ...ME.user, ...(r.data || {}), preferences: { ...(ME.user.preferences || {}), ...((r.data || {}).preferences || patch.preferences || {}) } };
    toast(msg); render();
  }
  async function upload(file) {
    const r = await wiki("attachments.create", { name: file.name, contentType: file.type, size: file.size, preset: "avatar" });
    const d = r.data;
    const form = new FormData();
    for (const k in d.form) form.append(k, d.form[k]);
    form.append("file", file);
    const res = await fetch(d.uploadUrl, { method: "POST", body: form, credentials: "same-origin", headers: { "x-csrf-token": csrf() } });
    if (!res.ok) throw new Error(`Hochladen hat nicht geklappt (Fehler ${res.status}).`);
    return d.attachment.url;
  }

  // --- Wiki: Allgemein ---

        ${setrow("Startansicht", "Wohin Brainbox nach der Anmeldung führt.", choice("data-team-select", "defaultCollectionId", t.defaultCollectionId || "", [["", "Startseite"], ...cols.map((c) => [c.id, `Sammlung „${c.name}“`])]))}

        ${setrow("Inhaltsverzeichnis", "Auf welcher Seite neben dem Text es steht.", choice("data-team-pref-select", "tocPosition", tp("tocPosition", "left"), [["left", "links"], ["right", "rechts"]]))}
        ${setrow("Wiki-Bild auf geteilten Seiten", "Öffentlich geteilte Seiten zeigen dein Wiki-Bild und den Namen.", toggle("data-team-pref", "publicBranding", tp("publicBranding", false)))}
      </div>`;
  }

  // --- Wiki: Mitglieder ---
  const ROLE = { admin: "Admin", member: "Mitglied", viewer: "Nur lesen", guest: "Gast" };
  function pMitglieder() {
    need("users", async () => (await wiki("users.list", { limit: 100, filter: "all", sort: "name", direction: "ASC" })).data || []);
    const users = Array.isArray(W.users) ? W.users : null;
    const admin = isAdmin();
    const row = (u) => {
      const bot = BRAINBOX_ACCOUNTS.test(u.email || "");
      const me = u.id === ME.user.id;
      const status = u.isSuspended ? '<span class="pill">gesperrt</span>' : !u.lastActiveAt ? '<span class="pill warn">eingeladen</span>' : `<span class="hint">aktiv ${esc(ago(u.lastActiveAt))}</span>`;
      const acts = !admin || me || bot ? (bot ? '<span class="pill ok">Brainbox</span>' : "") :
        `${choice("data-role", u.id, u.role, Object.entries(ROLE).filter(([k]) => k !== "guest" || u.role === "guest"))}
         ${!u.lastActiveAt && !u.isSuspended ? `<button type="button" class="btn small" data-user-act="resendInvite" data-id="${esc(u.id)}">Erneut einladen</button>` : ""}
         <button type="button" class="btn small ${u.isSuspended ? "" : "danger"}" data-user-act="${u.isSuspended ? "activate" : "suspend"}" data-id="${esc(u.id)}">${u.isSuspended ? "Entsperren" : "Sperren"}</button>`;
      return `<div class="member">${avatarBox(u.avatarUrl, u.name, u.color)}<div class="grow"><b>${esc(u.name)}${me ? " (du)" : ""}</b><div class="meta">${esc(u.email || "")} · ${esc(ROLE[u.role] || u.role)}</div></div><div class="status">${status}</div><div class="acts">${acts}</div></div>`;
    };
    return `${head("Wiki", "Mitglieder", `Wer im Wiki ist und was er darf. ${ME.team.inviteRequired ? "Rein kommt nur, wen du hier einlädst – egal ob per E-Mail, Passkey, Google oder Microsoft." : "Achtung: Einladungen sind nicht erforderlich (siehe Sicherheit)."}`)}
      ${admin || tp("membersCanInvite", false) ? `<div class="card"><h2>Jemanden einladen</h2>
        <form class="grid" data-form="invite">
          <label>E-Mail <input type="email" name="email" required placeholder="name@beispiel.de"></label>
          <label>Name <input type="text" name="name" placeholder="Vorname"></label>
          <label>Rolle ${choice("name", "role", ME.team.defaultUserRole || "member", [["member", "Mitglied – darf schreiben"], ["viewer", "Nur lesen"], ...(admin ? [["admin", "Admin – darf alles"]] : [])])}</label>
          <div class="full row"><button class="btn primary" type="submit">Einladen</button><span class="hint">Brainbox schickt eine E-Mail mit Link. Ohne Postfach: danach unter Brainbox → Übersicht einen Login-Link für die Person erstellen.</span></div>
        </form></div>` : ""}
      <div class="card"><h2>${users ? `${users.filter((u) => !u.isSuspended).length} Mitglieder` : "Mitglieder"}</h2>
        ${users ? `<div class="members">${users.map(row).join("")}</div>` : W.users?.error ? `<div class="empty">${esc(W.users.error)}</div>` : loading}
        <p class="hint">Rollen: <b>Admin</b> darf alles, <b>Mitglied</b> schreibt und legt Sammlungen an, <b>Nur lesen</b> sieht alles und ändert nichts. Gesperrte kommen nicht mehr rein, ihre Seiten bleiben.</p>
      </div>`;
  }

  // --- Wiki: Sicherheit ---

      <div class="card"><h2>Wer reinkommt</h2>

    ["Störung", ["Was passiert ist", "Ursache", "Lösung", "Damit es nicht wieder passiert"]],
    ["Anleitung", ["Ziel", "Schritte", "Prüfen, ob es geklappt hat"]],
  ];
  const pmDoc = (sections) => ({ type: "doc", content: sections.flatMap((h) => [{ type: "heading", attrs: { level: 2 }, content: [{ type: "text", text: h }] }, { type: "paragraph" }]) });
  function pVorlagen() {
    need("templates", async () => (await wiki("templates.list", { limit: 100 })).data || []);

    return `${head("Wiki", "Vorlagen", "Vorlagen sind Gerüste für Seiten, die du öfter brauchst. Beim Anlegen einer Seite wählst du oben „Vorlage“.")}
      <div class="card"><div class="row"><h2 class="grow" style="margin:0">${list ? `${list.length} Vorlagen` : "Vorlagen"}</h2><a class="btn primary" href="/settings/templates/new" style="text-decoration:none">Neue Vorlage</a></div>
        ${list ? (list.length ? `<div class="list">${list.map((x) => `<a class="server tmpl" href="/settings/templates/${esc(x.id)}" style="text-decoration:none;color:inherit"><span class="dot ok"></span><div><b>${esc(x.title || "Ohne Titel")}</b><div class="meta">geändert ${esc(ago(x.updatedAt))}</div></div><span class="pill">Bearbeiten</span></a>`).join("")}</div>` :
          `<div class="empty">Noch keine Vorlagen. Leg unten drei Beispiele an oder eine eigene.</div>`) : W.templates?.error ? `<div class="empty">${esc(W.templates.error)}</div>` : loading}
      </div>

        <ol class="steps">${SAMPLE_TEMPLATES.map(([t, s]) => `<li><div><b>${esc(t)}</b><p class="hint">${esc(s.join(" · "))}</p></div></li>`).join("")}</ol>
        <div class="row"><button type="button" class="btn" data-sample-templates>Diese drei als Vorlagen anlegen</button></div>

  function pExport() {

    const state = { complete: "fertig", creating: "läuft", uploading: "läuft", error: "Fehler", expired: "abgelaufen" };
    return `${head("Wiki", "Export", "Alle Seiten als Datei – zum Mitnehmen oder als zusätzliche Sicherung. Datenbank und Einstellungen sichert Brainbox außerdem vor jedem Update.")}
      <div class="card"><h2>Alles exportieren</h2>
        <form class="grid" data-form="export">
          <label>Format ${choice("name", "format", "outline-markdown", [["outline-markdown", "Markdown (zum Weiterverwenden)"], ["html", "HTML (zum Ansehen im Browser)"], ["json", "JSON (zum Wiederherstellen)"]])}</label>
          <label class="check" style="align-self:end"><input type="checkbox" name="attachments" checked> Bilder und Dateien mitnehmen</label>
          <div class="full row"><button class="btn primary" type="submit">Export starten</button><span class="hint">Dauert je nach Größe ein paar Minuten. Er erscheint dann unten zum Herunterladen.</span></div>

        ${list ? (list.length ? `<div class="list">${list.map((x) => `<div class="server"><span class="dot ${x.state === "complete" ? "ok" : x.state === "error" ? "bad" : "warn"}"></span><div><b>${esc(x.name || "Export")}</b><div class="meta">${esc(dateDe(x.createdAt))} · ${esc(String(x.format || "").replace("outline-markdown", "Markdown").toUpperCase())}${x.size ? ` · ${Math.max(1, Math.round(x.size / 1024))} KB` : ""} · ${esc(state[x.state] || x.state)}</div></div>
          <div class="acts">${x.state === "complete" ? `<a class="btn small" href="/api/fileOperations.redirect?id=${esc(x.id)}" target="_blank" rel="noopener" style="text-decoration:none">Herunterladen</a>` : ""}</div></div>`).join("")}</div>` :
          '<div class="empty">Noch kein Export.</div>') : W.exports?.error ? `<div class="empty">${esc(W.exports.error)}</div>` : loading}
      </div>`;
  }

  // --- Konto: Benachrichtigungen ---
  const NOTIFS = [
    ["Erwähnungen", "Jemand erwähnt dich mit @ auf einer Seite oder in einem Kommentar.", ["documents.mentioned", "comments.mentioned"]],
    ["Kommentare", "Neue Kommentare an Seiten, an denen du mitschreibst, und Antworten an dich.", ["comments.create", "comments.resolve"]],
    ["Änderungen", "Seiten, denen du folgst, wurden geändert.", ["documents.update"]],
    ["Neue Seiten", "In Sammlungen, denen du folgst, erscheint eine neue Seite.", ["documents.publish"]],
    ["Neue Sammlungen", "Jemand legt eine neue Sammlung an.", ["collections.create"]],
    ["Freigaben für dich", "Du bekommst Zugriff auf eine Seite oder Sammlung.", ["documents.add_user", "collections.add_user"]],
    ["Zugriffsanfragen", "Jemand möchte eine deiner Seiten sehen.", ["access_requests.create"]],
    ["Einladung angenommen", "Jemand, den du eingeladen hast, ist jetzt im Wiki.", ["emails.invite_accepted"]],
    ["Export fertig", "Dein Export liegt zum Herunterladen bereit.", ["emails.export_completed"]],
  ];
  const NOTIF_DEFAULT = { "documents.publish": false, "collections.create": false };
  function notifOn(ev) {
    const v = ME.user.notificationSettings?.[ev];
    if (v === undefined) return NOTIF_DEFAULT[ev] ?? true;
    return typeof v === "object" ? v.email !== false : !!v;
  }
  function pBenachrichtigungen() {
    return `${head("Konto", "Benachrichtigungen", `Worüber Brainbox dir eine E-Mail schickt${ME.user.email ? ` (an ${esc(ME.user.email)})` : ""}. Im Wiki selbst siehst du alles zusätzlich unter der Glocke unten links.`)}
      ${S && !S.login.email ? '<div class="card soft"><b>Noch kein Postfach eingerichtet.</b><p class="hint">Ohne Postfach verschickt Brainbox keine E-Mails. Einrichten unter Brainbox → Anmeldung → E-Mail.</p></div>' : ""}
      <div class="card"><h2>E-Mails</h2>
        ${NOTIFS.map(([t, d, evs]) => setrow(t, esc(d), toggle("data-notif", evs.join(","), evs.some(notifOn)))).join("")}
      </div>`;
  }

  // --- Bedienung der neuen Seiten ---
  async function guard(fn, el) {
    if (el) el.disabled = true;
    try { await fn(); } catch (e) { if (e.gate) gate(e.gate); else toast(e.message || "Das hat nicht geklappt."); render(); }
    finally { if (el && el.isConnected) el.disabled = false; }
  }
  ROOT.addEventListener("click", (e) => {
    const sw = e.target.closest("button.switch");
    if (sw && !sw.disabled) {
      const on = sw.getAttribute("aria-checked") !== "true";
      sw.setAttribute("aria-checked", String(on));
      if (sw.dataset.teamToggle) guard(() => saveTeam({ [sw.dataset.teamToggle]: on }), sw);
      else if (sw.dataset.teamPref) guard(() => saveTeam({ preferences: { [sw.dataset.teamPref]: sw.dataset.teamPref === "seamlessEdit" ? !on : on } }), sw);
      else if (sw.dataset.userPref) guard(() => saveUser({ preferences: { [sw.dataset.userPref]: on } }), sw);
      else if (sw.dataset.userPrefInv) guard(() => saveUser({ preferences: { [sw.dataset.userPrefInv]: !on } }), sw);
      else if (sw.dataset.notif) guard(async () => {
        for (const ev of sw.dataset.notif.split(",")) await wiki(on ? "users.notificationsSubscribe" : "users.notificationsUnsubscribe", { eventType: ev });
        ME.user.notificationSettings = { ...(ME.user.notificationSettings || {}) };
        for (const ev of sw.dataset.notif.split(",")) ME.user.notificationSettings[ev] = on;
        toast(on ? "Eingeschaltet" : "Ausgeschaltet");
      }, sw);
      return;
    }
    const logo = e.target.closest("[data-team-logo]");
    if (logo) { guard(() => saveTeam({ avatarUrl: "/images/brainbox-192.png" }, "Brainbox-Logo gesetzt"), logo); return; }
    const clr = e.target.closest("[data-user-avatar-clear]");
    if (clr) { guard(() => saveUser({ avatarUrl: null }, "Bild entfernt"), clr); return; }
    const ua = e.target.closest("[data-user-act]");
    if (ua) {
      const act = ua.dataset.userAct;
      if (act === "suspend" && !ua.dataset.sure) { ua.dataset.sure = "1"; ua.textContent = "Wirklich sperren?"; return; }
      guard(async () => { await wiki(`users.${act}`, { id: ua.dataset.id }); toast({ suspend: "Gesperrt", activate: "Entsperrt", resendInvite: "Einladung erneut geschickt" }[act]); delete W.users; render(); }, ua);
      return;
    }
    const smp = e.target.closest("[data-sample-templates]");
    if (smp) {
      guard(async () => { for (const [t, s] of SAMPLE_TEMPLATES) await wiki("templates.create", { title: t, data: pmDoc(s), publish: true }); toast("Drei Vorlagen angelegt"); delete W.templates; render(); }, smp);
      return;
    }
    const rl = e.target.closest("[data-reload]");
    if (rl) { delete W[rl.dataset.reload]; render(); }
  });
  ROOT.addEventListener("change", (e) => {
    const el = e.target;
    if (el.matches("[data-team-select]")) guard(() => saveTeam({ [el.dataset.teamSelect]: el.value || null }), el);
    else if (el.matches("[data-team-pref-select]")) guard(() => saveTeam({ preferences: { [el.dataset.teamPrefSelect]: el.value } }), el);
    else if (el.matches("[data-role]")) guard(async () => { await wiki("users.update_role", { id: el.dataset.role, role: el.value }); toast("Rolle geändert"); delete W.users; render(); }, el);
    else if (el.matches("[data-user-select]")) guard(async () => { await saveUser({ [el.dataset.userSelect]: el.value }); if (NAV_OUT) NAV_OUT({ type: "brainbox:reload" }); }, el);
    else if (el.matches("[data-theme-select]")) { try { localStorage.setItem("theme", JSON.stringify(el.value)); } catch (err) { /* egal */ } if (NAV_OUT) NAV_OUT({ type: "brainbox:theme", theme: el.value }); toast("Farbschema geändert"); }
    else if (el.matches("[data-upload]") && el.files && el.files[0]) {
      const who = el.dataset.upload, file = el.files[0];
      guard(async () => { const url = await upload(file); if (who === "team") await saveTeam({ avatarUrl: url }, "Wiki-Bild geändert"); else await saveUser({ avatarUrl: url }, "Bild geändert"); }, el);
    }
  });
  ROOT.addEventListener("submit", (e) => {
    const f = e.target.closest("form[data-form]");
    if (!f || !["team-name", "invite", "profile", "export", "ki-guidance"].includes(f.dataset.form)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    const d = Object.fromEntries(new FormData(f).entries());
    const btn = f.querySelector('button[type="submit"]');
    if (f.dataset.form === "team-name") guard(() => saveTeam({ name: d.name.trim(), description: (d.description || "").trim() }), btn);
    if (f.dataset.form === "profile") guard(() => saveUser({ name: d.name.trim() }), btn);
    if (f.dataset.form === "ki-guidance") guard(() => saveTeam({ guidanceMCP: (d.guidance || "").trim() || null }, "Anweisungen gespeichert"), btn);
    if (f.dataset.form === "invite") guard(async () => {
      const email = d.email.trim();
      await wiki("users.invite", { invites: [{ email, name: (d.name || "").trim() || email.split("@")[0], role: d.role || "member" }] });
      toast(`Einladung an ${email} verschickt`); delete W.users; render();
    }, btn);
    if (f.dataset.form === "export") guard(async () => {
      await wiki("collections.export_all", { format: d.format, includeAttachments: !!d.attachments });
      toast("Export läuft – er erscheint gleich unten"); delete W.exports; render();
      setTimeout(() => { if (view === "export") { delete W.exports; render(); } }, 8000);
    }, btn);
  }, true);

  const BRAINBOX_PAGES = ["uebersicht", "proxmox", "netbird", "claude", "bereiche", "anmeldung", "update"];
  const PAGES = { uebersicht: pUebersicht, proxmox: pProxmox, netbird: pNetbird, claude: pClaude, bereiche: pBereiche, anmeldung: pAnmeldung, update: pUpdate,
    allgemein: pAllgemein, mitglieder: pMitglieder, sicherheit: pSicherheit, vorlagen: pVorlagen, export: pExport, profil: pProfil, darstellung: pDarstellung, benachrichtigungen: pBenachrichtigungen };
  function render() {
    if (!ME) return; // erst zeichnen, wenn die Anmeldung geladen ist (load ruft render danach auf)
    if (!PAGES[view]) view = "uebersicht";
    if (!S && BRAINBOX_PAGES.includes(view)) { gate("admin"); return; }
    shell(PAGES[view]());
  }

  function gate(kind) {
    $("#app").innerHTML = `<div class="gate"><div class="box"><img src="${LOGO}" width="56" height="56" alt="">
      <h1>${kind === "admin" ? "Nur für Admins" : "Bitte anmelden"}</h1><p class="lede">${kind === "admin" ? "Diese Einstellungen sind nur für Admins des Wikis." : "Melde dich zuerst im Wiki an, dann geht es hier weiter."}</p>
      <a class="btn primary" href="/" style="text-decoration:none">${kind === "admin" ? "Zurück zum Wiki" : "Zum Wiki"}</a></div></div>`;
  }

  async function load() {
    try {
      try { S = await api("status"); } catch (e) { if (e.gate !== "admin") throw e; S = null; }
      ME = (await wiki("auth.info")).data;
      render();
    }
    catch (e) { if (e.gate) gate(e.gate); else $("#app").innerHTML = `<div class="gate"><div class="box"><h1>Keine Verbindung</h1><p class="lede">Der Brainbox-Dienst antwortet nicht. In ein paar Sekunden neu laden.</p></div></div>`; }
  }

  function show(id, r) {
    const el = $(`#out-${id}`) || $("#page .out");
    if (!el) return;
    el.hidden = false; el.className = `out ${r.ok ? "ok" : "bad"}`; el.textContent = r.output || (r.ok ? "Erledigt." : "Hat nicht geklappt.");
  }
  async function act(name, body, btn, outId) {
    const label = btn ? btn.textContent : "";
    if (btn) { btn.disabled = true; btn.textContent = "Läuft …"; }
    try {
      const r = await api(name, body || {});
      if (name === "proxmox/agent" && r.ok && r.data) { S = await api("status").catch(() => S); render(); const box = $("#agent-result"); if (box) { box.innerHTML = agentResult(r.data); box.scrollIntoView({ block: "nearest" }); } }
      else show(outId, r);
      if (r.ok && !["update/log", "link", "proxmox/test", "claude", "proxmox/agent"].includes(name)) { S = await api("status"); const keep = $(`#out-${outId}`)?.outerHTML; render(); if (keep) { const n = $(`#out-${outId}`); if (n) n.outerHTML = keep; } }
      if (name === "update/start") pollUpdate();
      return r;
    } catch (e) { if (e.gate) gate(e.gate); else show(outId, { ok: false, output: String(e.message || e) }); }
    finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
  }
  function pollUpdate() { let n = 0; const t = setInterval(async () => { n++; try { const r = await api("update/log", {}); show("update", r); } catch (e) { /* während des Neustarts */ } if (n > 240) clearInterval(t); }, 5000); }

  ROOT.addEventListener("click", (e) => {
    const link = e.target.closest("a[href]");
    if (link && NAV_OUT && !link.target) {
      const href = link.getAttribute("href");
      if (href.startsWith("/")) { e.preventDefault(); NAV_OUT({ type: "brainbox:open", href }); return; }
      link.target = "_blank"; link.rel = "noopener";
    }
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const rn = e.target.closest("[data-rename]");
    if (rn) { const f = rn.closest(".server").querySelector("form.rename"); f.hidden = !f.hidden; if (!f.hidden) f.newName.select(); return; }
    const rc = e.target.closest("[data-rename-cancel]");
    if (rc) { rc.closest("form").hidden = true; return; }
    const c = e.target.closest("[data-copy]");
    if (c) { copy(c.dataset.copy, c); return; }
    const a = e.target.closest("[data-act]");
    if (a) {
      const name = a.dataset.act, out = name.split("/")[0];
      if (name === "proxmox/remove" && !a.dataset.sure) { a.dataset.sure = "1"; a.textContent = "Wirklich entfernen?"; return; }
      if (name === "netbird/remove" && !a.dataset.sure) { a.dataset.sure = "1"; a.textContent = "Wirklich trennen?"; return; }
      if (name === "update/start" && !a.dataset.sure) { a.dataset.sure = "1"; a.textContent = "Jetzt wirklich starten?"; return; }
      act(name, a.dataset.name ? { name: a.dataset.name } : {}, a, out);
      return;
    }
    const clr = e.target.closest("[data-clear]");
    if (clr) {
      const keys = { email: ["SMTP_HOST", "SMTP_PORT", "SMTP_USERNAME", "SMTP_PASSWORD", "SMTP_FROM_EMAIL"], google: ["GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET"], microsoft: ["AZURE_CLIENT_ID", "AZURE_CLIENT_SECRET", "AZURE_TENANT_ID"], discord: ["DISCORD_CLIENT_ID", "DISCORD_CLIENT_SECRET", "DISCORD_SERVER_ID"], oidc: ["OIDC_CLIENT_ID", "OIDC_CLIENT_SECRET", "OIDC_ISSUER_URL"] }[clr.dataset.clear] || [];
      act("login", { values: Object.fromEntries(keys.map((k) => [k, ""])) }, clr, "login");
    }
  });
  ROOT.addEventListener("submit", (e) => {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f).entries());
    const btn = f.querySelector('button[type="submit"]');
    const kind = f.dataset.form;
    if (kind === "proxmox") act("proxmox/add", { name: d.name.trim().toLowerCase(), url: d.url.trim(), tokenId: d.tokenId.trim(), secret: d.secret, insecure: !!f.insecure.checked }, btn, "proxmox");
    if (kind === "netbird") act("netbird", { url: d.url.trim(), token: d.token }, btn, "netbird");
    if (kind === "proxmox-agent") act("proxmox/agent", { name: d.name.trim().toLowerCase() }, btn, "proxmox");
    if (kind === "proxmox-rename") act("proxmox/rename", { name: f.dataset.name, newName: d.newName.trim().toLowerCase() }, btn, "proxmox");
    if (kind === "link") act("link", { email: (d.email || "").trim() }, btn, "link");
    if (kind === "login") {
      const values = {};
      for (const [k, v] of Object.entries(d)) { if (k === "SMTP_PRESET") continue; if (String(v).trim() !== "") values[k] = String(v).trim(); }
      if (d.SMTP_PRESET !== undefined && values.SMTP_USERNAME) {
        const [host, port] = d.SMTP_PRESET.split(":");
        Object.assign(values, { SMTP_HOST: host, SMTP_PORT: port, SMTP_SECURE: port === "465" ? "true" : "false", SMTP_SERVICE: "" });
        values.SMTP_FROM_EMAIL = values.SMTP_FROM_EMAIL || values.SMTP_USERNAME;
      }
      act("login", { values }, btn, "login");
    }
  });
  if (USE_HASH) window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== view && PAGES[h]) { view = h; render(); } });
  load();
})();
</script>
</body>
</html>
